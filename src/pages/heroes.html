<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AOV HUB - Danh sách Tướng</title>

    <link rel="stylesheet" href="/css/reset.css">
    <link rel="stylesheet" href="/css/variables.css">
    <link rel="stylesheet" href="/css/common.css">
    <link rel="stylesheet" href="/css/hero.css">
</head>
<body data-page="heroes">

    <header id="site-header"></header>

    <main class="container section">
        <div class="hero-page-head">
            <h1>Danh sách Tướng</h1>
            <span class="hero-page-head__count" id="hero-count"></span>
        </div>

        <!-- Filter + tìm kiếm và danh sách được render bởi js/hero.js từ src/data/heroes.json -->
        <div id="hero-filter-bar"></div>
        <div class="grid grid--heroes" id="hero-list"></div>
        <!-- Thanh phân trang (4 cột × 3 dòng = 12 tướng/trang) do js/hero.js vẽ -->
        <div id="hero-pagination"></div>
    </main>

    <footer id="site-footer"></footer>

    <script src="/src/js/config.js"></script>
    <script src="/src/js/loadData.js"></script>
    <script src="/src/js/components.js"></script>
    <script src="/src/js/auth.js"></script>
    <script src="/src/js/layout.js"></script>
    <script src="/src/js/storage.js"></script>
    <script src="/src/js/favorite.js"></script>
    <script src="/src/js/search.js"></script>
    <script src="/src/js/hero.js"></script>
</body>
</html>
