<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AOV HUB - Danh sách Trang bị</title>

    <link rel="stylesheet" href="/css/reset.css">
    <link rel="stylesheet" href="/css/variables.css">
    <link rel="stylesheet" href="/css/common.css">
    <link rel="stylesheet" href="/css/item.css">
</head>
<body data-page="items">

    <header id="site-header"></header>

    <main class="container section">
        <div class="item-page-head">
            <h1>Danh sách Trang bị</h1>
            <span class="item-page-head__count" id="item-count"></span>
        </div>
        <p class="item-page-desc">
            Dữ liệu đọc động từ <code>src/data/items.json</code> — tìm theo tên và lọc theo loại trang bị.
        </p>

        <!-- Ô tìm kiếm + nút lọc loại do item.js sinh ra -->
        <div id="item-filter-bar"></div>
        <div class="grid grid--items" id="item-list"></div>
        <div id="item-pagination"></div>
    </main>

    <footer id="site-footer"></footer>

    <script src="/src/js/config.js"></script>
    <script src="/src/js/loadData.js"></script>
    <script src="/src/js/components.js"></script>
    <script src="/src/js/auth.js"></script>
    <script src="/src/js/layout.js"></script>
    <script src="/src/js/storage.js"></script>
    <script src="/src/js/favorite.js"></script>
    <script src="/src/js/search.js"></script>
    <script src="/src/js/item.js"></script>
</body>
</html>
