<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AOV HUB - So sánh Tướng</title>

    <link rel="stylesheet" href="/css/reset.css">
    <link rel="stylesheet" href="/css/variables.css">
    <link rel="stylesheet" href="/css/common.css">
    <link rel="stylesheet" href="/css/compare.css">
</head>
<body data-page="compare">

    <header id="site-header"></header>

    <main class="container section">
        <h1>So sánh Tướng</h1>

        <!--
            2 khối dưới do js/compare.js vẽ:
            - #compare-select: 2 ô <select> chọn tướng (đọc src/data/heroes.json)
            - #compare-table:  bảng so sánh HP/Attack/Defense/Speed/Difficulty,
                               chỉ số cao hơn được tô nổi
            Cặp tướng đang so sánh lưu ở aov_compare (js/storage.js) nên F5 không mất.

            Bảng (thead + tbody) do compare.js dựng hoàn toàn bằng innerHTML nên
            huy hiệu role (.hero-role-badge) và các ô chỉ số (.stat-bar /
            .stat-bar-fill / .stat-diff) nằm trong template của compare.js.

            2 khối dưới đây do compare.js đổ nội dung vào (tự tạo nếu thiếu):
            - #score-summary:   điểm tổng hợp Sống sót / Sát thương / Cơ động
            - #compare-summary: nhận xét tự động sinh từ dữ liệu 2 tướng
        -->
        <div id="compare-select"></div>
        <div id="compare-table"></div>

        <section id="score-summary" class="compare-score" aria-label="Điểm tổng hợp của 2 tướng"></section>
        <section id="compare-summary" class="compare-summary" aria-label="Nhận xét so sánh 2 tướng"></section>
    </main>

    <footer id="site-footer"></footer>

    <script src="/src/js/config.js"></script>
    <script src="/src/js/dataStore.js"></script>
    <script src="/src/js/loadData.js"></script>
    <script src="/src/js/components.js"></script>
    <script src="/src/js/auth.js"></script>
    <script src="/src/js/layout.js"></script>
    <script src="/src/js/storage.js"></script>
    <!-- heroData.js: lớp dữ liệu tướng (loadHeroes) -->
    <script src="/src/js/heroData.js"></script>
    <script src="/src/js/compare.js"></script>
</body>
</html>
