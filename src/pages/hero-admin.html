<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AOV HUB - Chuyển đến Quản lý</title>

    <!--
        Trang quản lý tướng cũ đã được gộp vào mục "Tướng" của trang Quản lý
        (/src/pages/admin.html?tab=heroes). Giữ file này để link cũ / bookmark
        không bị hỏng: chuyển hướng bằng 2 lớp (meta refresh + script) cho chắc,
        dùng location.replace để nút Back không quay lại trang chuyển hướng.
        Quyền admin do admin.html tự kiểm tra (fail-closed), trang này không cần guard.
    -->
    <meta http-equiv="refresh" content="0; url=/src/pages/admin.html?tab=heroes">
    <script>location.replace('/src/pages/admin.html?tab=heroes');</script>
</head>
<body>
    <div style="background:#FAF3E1; color:#3A2F1C; font:inherit; padding:48px; text-align:center;">
        <p>Đang chuyển đến mục Quản lý tướng...</p>
        <p><a href="/src/pages/admin.html?tab=heroes">bấm vào đây nếu trang không tự chuyển</a></p>
    </div>
</body>
</html>
