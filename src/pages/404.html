<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AOV HUB - Không tìm thấy trang (404)</title>

    <link rel="stylesheet" href="/css/reset.css">
    <link rel="stylesheet" href="/css/variables.css">
    <link rel="stylesheet" href="/css/common.css">
</head>
<body data-page="404">

    <header id="site-header"></header>

    <main class="container section">
        <div class="not-found-page" id="not-found-content"></div>
    </main>

    <footer id="site-footer"></footer>

    <script src="/src/js/config.js"></script>
    <script src="/src/js/loadData.js"></script>
    <script src="/src/js/components.js"></script>
    <script src="/src/js/auth.js"></script>
    <script src="/src/js/layout.js"></script>
    <script>
        (function () {
            var box = document.getElementById('not-found-content');
            if (!box) return;

            var message = new URLSearchParams(window.location.search).get('message')
                || 'Trang bạn tìm không tồn tại hoặc đã bị di chuyển.';

            box.innerHTML = `
                <p class="not-found-page__code">404</p>
                ${renderNotFound(message)}
                <div class="not-found-page__actions">
                    <a class="btn btn-primary" href="${BASE_PATH}index.html">Về trang chủ</a>
                    <a class="btn btn-outline" href="${BASE_PATH}src/pages/heroes.html">Xem tướng</a>
                    <a class="btn btn-outline" href="${BASE_PATH}src/pages/items.html">Xem trang bị</a>
                </div>
            `;
        })();
    </script>
</body>
</html>
