<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AOV HUB - Yêu thích</title>

    <link rel="stylesheet" href="/css/reset.css">
    <link rel="stylesheet" href="/css/variables.css">
    <link rel="stylesheet" href="/css/common.css">
    <link rel="stylesheet" href="/css/favorite.css">
</head>
<body data-page="favorite">

    <header id="site-header"></header>

    <main class="container section">
        <h1>Yêu thích &amp; Lịch sử tra cứu</h1>

        <!--
            2 tab + danh sách do js/favorite.js vẽ:
            - #favorite-tabs: 2 tab "Yêu thích" / "Lịch sử", tab đang chọn ghi ở ?tab=
            - #favorite-list:  tab Yêu thích chia 2 nhóm (Tướng / Trang bị),
                               tab Lịch sử là các tướng đã xem + nút "Xóa lịch sử"
            Dữ liệu lấy từ aov_favorites / aov_history (js/storage.js) và đối chiếu
            với src/data/heroes.json + src/data/items.json.
        -->
        <div class="tabs" id="favorite-tabs"></div>
        <div class="favorite-list" id="favorite-list"></div>
    </main>

    <footer id="site-footer"></footer>

    <script src="/src/js/config.js"></script>
    <script src="/src/js/loadData.js"></script>
    <script src="/src/js/components.js"></script>
    <script src="/src/js/search.js"></script>
    <script src="/src/js/auth.js"></script>
    <script src="/src/js/layout.js"></script>
    <script src="/src/js/storage.js"></script>
    <!-- heroData.js: lớp dữ liệu tướng (loadHeroes) -->
    <script src="/src/js/heroData.js"></script>
    <script src="/src/js/favorite.js"></script>
</body>
</html>
