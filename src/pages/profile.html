<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AOV HUB - Profile</title>

    <link rel="stylesheet" href="/css/reset.css">
    <link rel="stylesheet" href="/css/variables.css">
    <link rel="stylesheet" href="/css/common.css">
    <link rel="stylesheet" href="/css/auth.css">
    <link rel="stylesheet" href="/css/feed.css">
</head>
<body data-page="profile">

    <!-- Task 36 - Guard: chặn truy cập nếu chưa đăng nhập (chạy trước khi vẽ nội dung) -->
    <script src="/src/js/config.js"></script>
    <script src="/src/js/dataStore.js"></script>
    <script src="/src/js/auth.js"></script>
    <script>requireAuth();</script>

    <header id="site-header"></header>

    <main class="container section">
        <div class="profile-card">
            <span class="profile-card__avatar" aria-hidden="true">👤</span>
            <div>
                <h1 class="profile-card__name" id="profile-username">-</h1>
                <span class="profile-card__status">Đã đăng nhập</span>
                <p class="profile-card__joined" id="profile-joined"></p>
            </div>
            <button type="button" class="btn btn-outline" id="profile-logout">Đăng xuất</button>
        </div>

        <ul class="profile-stats" id="profile-stats"></ul>

        <div class="section__header">
            <h2>Bài viết của bạn</h2>
            <a class="section__link" href="feed.html">Tới trang Cộng đồng &rarr;</a>
        </div>
        <div id="profile-posts" class="feed-list"></div>
    </main>

    <footer id="site-footer"></footer>

    <script src="/src/js/loadData.js"></script>
    <script src="/src/js/components.js"></script>
    <script src="/src/js/layout.js"></script>
    <script src="/src/js/storage.js"></script>
    <!-- heroData.js: lớp dữ liệu tướng (loadHeroes) -->
    <script src="/src/js/heroData.js"></script>
    <script src="/src/js/search.js"></script>
    <script src="/src/js/feed.js"></script>
    <!-- profile.js: thông tin tài khoản, thống kê và bài viết của người đang đăng nhập (L19/STT 13) -->
    <script src="/src/js/profile.js"></script>
</body>
</html>
