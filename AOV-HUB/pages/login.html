<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AOV HUB - Đăng nhập</title>

    <link rel="stylesheet" href="/css/reset.css">
    <link rel="stylesheet" href="/css/variables.css">
    <link rel="stylesheet" href="/css/common.css">
    <link rel="stylesheet" href="/css/auth.css">
</head>
<body data-page="login">

    <header id="site-header"></header>

    <main class="container auth-section">
        <div class="auth-card">
            <h1>Đăng nhập</h1>
            <p class="auth-card__desc">Đăng nhập để tiếp tục sử dụng AOV HUB.</p>

            <div id="login-errors"></div>

            <form id="login-form" novalidate>
                <div class="form-group">
                    <label for="login-username">Username</label>
                    <input type="text" id="login-username" name="username" autocomplete="username">
                </div>
                <div class="form-group">
                    <label for="login-password">Password</label>
                    <input type="password" id="login-password" name="password" autocomplete="current-password">
                </div>
                <button type="submit" class="btn btn-primary">Đăng nhập</button>
            </form>

            <p class="auth-card__switch">Chưa có tài khoản? <a href="/pages/register.html">Đăng ký</a></p>
        </div>
    </main>

    <footer id="site-footer"></footer>

    <script src="/js/loadData.js"></script>
    <script src="/js/components.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/layout.js"></script>
    <script>
        document.getElementById('login-form').addEventListener('submit', (event) => {
            event.preventDefault();

            const username = document.getElementById('login-username').value;
            const password = document.getElementById('login-password').value;
            const errorBox = document.getElementById('login-errors');

            if (!username.trim() || !password) {
                renderErrors(errorBox, ['Vui lòng nhập đầy đủ Username và Password.']);
                return;
            }

            const success = loginUser(username, password);

            if (!success) {
                renderErrors(errorBox, ['Username hoặc mật khẩu không chính xác.']);
                return;
            }

            window.location.href = '/index.html';
        });
    </script>
</body>
</html>
