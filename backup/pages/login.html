<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AOV HUB - Đăng nhập</title>

    <link rel="stylesheet" href="/css/reset.css">
    <link rel="stylesheet" href="/css/variables.css">
    <link rel="stylesheet" href="/css/common.css">
    <link rel="stylesheet" href="/css/auth.css">
</head>
<body data-page="login">

    <header id="site-header"></header>

    <main class="container auth-section">
        <div class="auth-card">
            <h1>Đăng nhập</h1>
            <p class="auth-card__desc">Đăng nhập để đăng bài, bình luận và xem trang cá nhân.</p>

            <div id="login-errors"></div>

            <form id="login-form" novalidate>
                <div class="form-group">
                    <label for="login-username">Username</label>
                    <input type="text" id="login-username" name="username" autocomplete="username">
                </div>
                <div class="form-group">
                    <label for="login-password">Password</label>
                    <input type="password" id="login-password" name="password" autocomplete="current-password">
                </div>
                <button type="submit" class="btn btn-primary">Đăng nhập</button>
            </form>

            <p class="auth-card__switch">Chưa có tài khoản? <a href="/pages/register.html">Đăng ký</a></p>
            <p class="auth-card__hint">Tài khoản demo: <strong>demo</strong> / <strong>123456</strong></p>
        </div>
    </main>

    <footer id="site-footer"></footer>

    <script src="/js/loadData.js"></script>
    <script src="/js/components.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/layout.js"></script>
    <script>
        // Task 32 - Đăng nhập
        // Đã đăng nhập rồi thì không cần vào trang này nữa
        redirectIfLoggedIn();

        document.getElementById('login-form').addEventListener('submit', async (event) => {
            event.preventDefault();

            // Chờ nạp xong danh sách user (lần đầu mở web lấy từ data/users.json)
            await usersReady;

            const username = document.getElementById('login-username').value;
            const password = document.getElementById('login-password').value;
            const errorBox = document.getElementById('login-errors');

            if (!username.trim() || !password) {
                renderErrors(errorBox, ['Vui lòng nhập đầy đủ Username và Password.']);
                return;
            }

            const success = loginUser(username, password);

            if (!success) {
                renderErrors(errorBox, ['Username hoặc mật khẩu không chính xác.']);
                return;
            }

            // Nếu bị Guard đẩy về đây thì quay lại đúng trang cũ (Task 36)
            const redirect = new URLSearchParams(window.location.search).get('redirect');
            const safeRedirect = redirect && redirect.startsWith('/') ? redirect : '/index.html';

            window.location.href = safeRedirect;
        });
    </script>
</body>
</html>
